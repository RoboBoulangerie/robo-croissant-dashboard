[package]
name = "robo-croissant-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "^0.4", features = ["serde"] }
capitalize = "0.3.4"
diesel = { version = "2", features = ["returning_clauses_for_sqlite_3_35", "sqlite", "serde_json", "chrono"] }
json_dotpath = "1.1"
lazy_static = "1.5.0"
log = { version = "^0.4", features = ["std"] }
regex = "1.12.2"
rocket = { version = "0.5.1", features = ["json"] }
rocket_dyn_templates = { version = "0.2.0", features = ["tera"] }
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_sqlite_pool"] }
serde_json = "1.0.149"
tera = "1.20.1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
percent-encoding = "2"

